name: Android Release

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          if [[ -z "$release_tag" || "$release_tag" == "$GITHUB_REF_NAME" ]]; then
            echo "Release branch must be named release/<tag>." >&2
            exit 1
          fi

          apk_path="$(find androidApp/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "No release APK found." >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_meta.outputs.release_tag }}" \
            "${{ steps.release_meta.outputs.apk_path }}#Schulte-${{ steps.release_meta.outputs.release_tag }}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Android ${{ steps.release_meta.outputs.release_tag }}" \
            --notes "Android release built from ${GITHUB_SHA}."
