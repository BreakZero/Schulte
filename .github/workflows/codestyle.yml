name: Codestyle

on:
  push:

permissions:
  contents: read

jobs:
  ktlint:
    name: ktlintCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Kotlin codestyle
        run: ./gradlew ktlintCheck
